<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="report-fingerprint" content="{{FINGERPRINT}}">
<title>{{TITLE}}</title>
<style>{{STYLE}}</style>
</head>
<body class="{{MODE}}">
<main id="report">{{PAGES}}</main>
<nav id="toolbar" aria-label="报告控制">
<button data-action="prev" title="上一页" aria-label="上一页"><i data-lucide="chevron-left"></i></button>
<input id="page-input" type="number" min="1" value="1" aria-label="报告页码"><span id="page-total"></span>
<button data-action="next" title="下一页" aria-label="下一页"><i data-lucide="chevron-right"></i></button>
<button data-action="presenter" title="讲者台" aria-label="讲者台"><i data-lucide="presentation"></i></button>
<button data-action="full" title="全屏" aria-label="全屏"><i data-lucide="maximize"></i></button>
<button data-action="print" title="打印" aria-label="打印"><i data-lucide="printer"></i></button>
</nav>
<p id="report-error" role="alert" hidden></p>
<script id="report-data" type="application/json">{{DATA}}</script>
{{SCRIPTS}}
</body>
</html>
